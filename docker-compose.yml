version: "3.8"

services:
  anonx-bot:
    image: ghcr.io/yourusername/anonx-cpp:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: anonx_music_bot
    restart: unless-stopped
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - API_ID=${API_ID}
      - API_HASH=${API_HASH}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - AUTO_UPDATE_YTDLP=true
    volumes:
      - ./config.json:/app/config.json:ro
      - ./data:/app/data
      - ./sessions:/app/sessions
      - ./downloads:/app/downloads
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 700M
        reservations:
          memory: 120M
