name: Production Multi-Arch Release & Container Publishing

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  build-binaries:
    name: Build Native Binary (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            triplet: x64-linux-release
          - os: ubuntu-24.04-arm
            arch: aarch64
            triplet: arm64-linux-release

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install System Build Toolchain & Mold
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            mold \
            ccache \
            pkg-config \
            libssl-dev \
            libopus-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswresample-dev

      - name: Configure ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-${{ matrix.arch }}-ccache-${{ github.sha }}
          restore-keys: ${{ runner.os }}-${{ matrix.arch }}-ccache-

      - name: Cache vcpkg Binary Artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: ${{ matrix.triplet }}-vcpkg-${{ hashFiles('vcpkg.json') }}

      - name: Setup vcpkg
        run: |
          if [ ! -d "$GITHUB_WORKSPACE/vcpkg" ]; then
            git clone --depth=1 https://github.com/microsoft/vcpkg.git $GITHUB_WORKSPACE/vcpkg
            $GITHUB_WORKSPACE/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          fi

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}

      - name: Build Executable
        run: cmake --build build --target anonx_bot --parallel $(nproc)

      - name: Package Release Archive
        run: |
          mkdir -p dist
          cp build/anonx_bot dist/
          cp scripts/install.sh dist/
          if [ -f config.example.json ]; then
            cp config.example.json dist/
          fi
          tar -czvf anonx-bot-${{ matrix.arch }}.tar.gz -C dist .

      - name: Upload Binary to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: anonx-bot-${{ matrix.arch }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-docker:
    name: Build & Push Multi-Arch Docker Image to GHCR
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up QEMU for Emulation
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == format('refs/tags/{0}', github.ref_name) }}

      - name: Build and Push Multi-Arch Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
